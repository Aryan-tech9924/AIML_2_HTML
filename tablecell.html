<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Cell that spans two rows</h1>

    <h4>To make a cell span more than one row, the rowspan attribute.</h4>
    <table>
        <tr><th>Name</th>
            <th>jhill</th></tr>

        <tr>
            <td rowspan="2">Phone</td>
            <td>1234567890</td>
        </tr>
        <tr><td>76239478</td>
        </tr>
    </table>

</body>
</html>
